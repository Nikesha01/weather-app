<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dashboard">
        <div class="search-container">
            <div class="searchBox">
                <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="25" height="25" viewBox="0 0 32 32">
                    <path
                        d="M 19 3 C 13.488281 3 9 7.488281 9 13 C 9 15.394531 9.839844 17.589844 11.25 19.3125 L 3.28125 27.28125 L 4.71875 28.71875 L 12.6875 20.75 C 14.410156 22.160156 16.605469 23 19 23 C 24.511719 23 29 18.511719 29 13 C 29 7.488281 24.511719 3 19 3 Z M 19 5 C 23.429688 5 27 8.570313 27 13 C 27 17.429688 23.429688 21 19 21 C 14.570313 21 11 17.429688 11 13 C 11 8.570313 14.570313 5 19 5 Z">
                    </path>
                </svg>
                <input type="text" id="city-input" placeholder="Enter a city">
            </div>
            <button type="button" class="search-button" id="search-button">Search</button>
        </div>

        <div class="content-layout">
            <div class="left-content">
                <div class="main-container">
                    <h4 id="weather-date">Monday, 4 November. 2:48</h6>
                        <h2 id="city-name">Colombo , Sri Lanka</h2>
                        <h1 id="temperature">29&deg;C</h1>
                        <h4 id="weather-feel">Partly Sunny . Feels like 33&deg;</h4>


                        <div class="sun-arc">
                            <svg viewBox="0 0 460 240" xmlns="http://www.w3.org/2000/svg" class="sun-arc-svg">

                                <path class="arc-dotted" d="M 20 210 A 210 190 0 0 1 440 210" />

                                <path  id="arc-orange" class="arc-orange" d="M 20 210 A 210 190 0 0 1 300 40" />

                                <circle cx="300" cy="40" r="27" class="sun-glow" />

                                <circle cx="300" cy="40" r="15" class="sun" />

                                <line x1="0" y1="210" x2="460" y2="210" class="horizon" />

                                <text id="sunrise-label" x="20" y="228" class="sun-label">
                                    Sunrise 6:02
                                </text>

                                <text id="sunset-label" x="440" y="228" text-anchor="end" class="sun-label">
                                    Sunset 17:56
                                </text>

                            </svg>
                        </div>
                </div>

                <div class="sub-container">
                    <div class="row">
                        <span>Humidity</span>
                        <h3 id="humidity">78%</h3>

                    </div>
                    <div class="row">
                        <span>Wind</span>
                        <h3 id="wind">14 Km/h</h3>
                    </div>
                    <div class="row">
                        <span>UV index</span>
                        <h3 id="uv-index">9<span>very high</span></h3>
                    </div>
                    <div class="row">
                        <span>Rain chance</span>
                        <h3 id="rain-chance">60%</h3>
                    </div>
                </div>

                <div class="hourly-container">

                    <div class="hourly-header">
                        <h3>Today, hour by hour</h3>
                        <span id="rain-message">Hourly forecast</span>
                    </div>

                    <div class="hourly-chart">
                        <svg id="hourly-graph" viewBox="0 0 760 150" preserveAspectRatio="none">

                            <rect id="rain-highlight" x="440" y="15" width="130" height="80" rx="12" fill="#203b4e" />

                            <path id="temperature-line" d="M 15 105 Q 140 90 250 55 T 745 115" fill="none"
                                stroke="#ffb33f" stroke-width="3.5" stroke-linecap="round" />

                            <circle id="temperature-dot" cx="290" cy="55" r="6" fill="#ffb33f" />
                        </svg>
                    </div>

                    <div id="hourly-labels" class="hourly-labels">
                        <span>Now</span>
                        <span>12 PM</span>
                        <span>1 PM · 31°</span>
                        <span>3 PM</span>
                        <span>5 PM</span>
                        <span>7 PM</span>
                    </div>

                </div>
            </div>

            <div class="weekly-forecast">
                <h3>7-day outlook</h3>
                <div id="weekly-list">

                </div>

            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
